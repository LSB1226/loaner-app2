<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사고대차 차량 관리앱</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(30, 41, 59, 0.06) 0%, transparent 24%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.05) 0%, transparent 20%),
        linear-gradient(180deg, #f3f6fa 0%, #eef2f7 48%, #f8fafc 100%);
      color: #0f172a;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px;
    }

    .hero {
      background:
        linear-gradient(135deg, #0b1220 0%, #162033 45%, #1f3453 100%);
      color: white;
      border-radius: 28px;
      padding: 28px 24px;
      margin-bottom: 22px;
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -70px;
      top: -70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      filter: blur(10px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      left: -60px;
      bottom: -90px;
      border-radius: 50%;
      background: rgba(59,130,246,0.14);
      filter: blur(18px);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .hero-brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      backdrop-filter: blur(6px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .hero-brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 12px rgba(96,165,250,0.85);
      flex-shrink: 0;
    }

    .hero-brand-text {
      font-size: 13px;
      font-weight: 800;
      color: rgba(255,255,255,0.95);
    }

    .hero-title {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.8px;
      line-height: 1.1;
      text-shadow: 0 4px 18px rgba(0,0,0,0.18);
    }

    .hero-title .accent {
      color: #dbeafe;
      font-weight: 900;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 12px 15px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: rgba(255,255,255,0.96);
      color: #0f172a;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
    }

    .btn-outline {
      background: white;
      color: #0f172a;
      border: 1px solid #d6dde8;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      border-radius: 24px;
      padding: 18px;
      border: 1px solid #e5eaf1;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
      text-align: left;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      position: relative;
      overflow: hidden;
      transition: 0.18s ease;
    }

    .stat:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
    }

    .stat::after {
      content: "";
      position: absolute;
      inset: auto -20px -35px auto;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(148,163,184,0.08);
      filter: blur(10px);
    }

    .stat small {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
      font-weight: 700;
    }

    .stat strong {
      font-size: 30px;
      position: relative;
      z-index: 1;
      letter-spacing: -0.5px;
    }

    .active-all {
      background: linear-gradient(135deg, #1e293b, #0f172a 62%, #1d4ed8);
      color: white;
      border-color: transparent;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.18);
    }
    .active-all small { color: rgba(255,255,255,0.82); }

    .active-ready {
      background: linear-gradient(135deg, #059669, #10b981 58%, #34d399);
      color: white;
      border-color: transparent;
      box-shadow: 0 16px 30px rgba(5, 150, 105, 0.22);
    }
    .active-ready small { color: rgba(255,255,255,0.88); }

    .active-out {
      background: linear-gradient(135deg, #b91c1c, #dc2626 58%, #ef4444);
      color: white;
      border-color: transparent;
      box-shadow: 0 16px 30px rgba(220, 38, 38, 0.24);
    }
    .active-out small { color: rgba(255,255,255,0.9); }

    .active-reserved {
      background: linear-gradient(135deg, #b45309, #d97706 58%, #f59e0b);
      color: white;
      border-color: transparent;
      box-shadow: 0 16px 30px rgba(217, 119, 6, 0.24);
    }
    .active-reserved small { color: rgba(255,255,255,0.9); }

    .toolbar {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 14px;
    }

    .toolbar.show { display: flex; }

    .toolbar-left-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .toolbar-left-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .toolbar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .search {
      flex: 1;
      min-width: 220px;
      background: rgba(255,255,255,0.96);
      border: 1px solid #d6dde8;
      border-radius: 15px;
      padding: 12px 14px;
      font-size: 14px;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .card {
      display: none;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(8px);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(226,232,240,0.9);
    }

    .card.show { display: block; }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .vehicle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .vehicle-item {
      border: 1px solid #e7edf4;
      border-radius: 20px;
      padding: 15px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
    }

    .vehicle-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .vehicle-model {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.2px;
    }

    .vehicle-number {
      font-size: 13px;
      color: #64748b;
      margin-top: 3px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .bg-ready {
      background: #dcfce7;
      color: #047857;
      border-color: #bbf7d0;
    }

    .bg-out {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .bg-reserved {
      background: #fef3c7;
      color: #b45309;
      border-color: #fde68a;
    }

    .vehicle-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
      gap: 10px;
    }

    .vehicle-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .vehicle-actions .btn { flex: 1; }

    .muted-empty {
      text-align: center;
      color: #64748b;
      padding: 28px 10px;
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      background: #f8fafc;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal.show { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .modal-sub {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
    }

    .info-box.full { grid-column: 1 / -1; }

    .label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .value {
      font-size: 15px;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-two {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 14px;
      background: white;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .form-actions-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .info-grid, .form-two { grid-template-columns: 1fr; }
      .toolbar-right { width: 100%; }
      .btn { width: auto; }
      .vehicle-actions { flex-direction: row; }
      .hero-title { font-size: 27px; }
      .hero { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
  <div class="hero-top">
    <div class="hero-brand-wrap">
      <div class="hero-brand">
        <span class="hero-brand-dot"></span>
        <span class="hero-brand-text">중부1급모터스</span>
      </div>
      <h1 class="hero-title">
        <span class="accent">대차 운영 현황</span>
      </h1>
    </div>
  </div>
</div>

<div style="margin: 6px 0 18px 0; display: flex; justify-content: flex-end;">
  <button onclick="openForm()" style="
    background: none;
    border: none;
    font-size: 16px;
    font-weight: 800;
    color: #1d4ed8;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  ">
    <span style="font-size:20px;">＋</span> 차량 추가
  </button>
</div>

    <div class="grid">
      <button class="stat" id="tab-all" onclick="selectTab('전체')"><small>전체차량</small><strong id="count-all">0</strong></button>
      <button class="stat" id="tab-ready" onclick="selectTab('대기차량')"><small>대기차량</small><strong id="count-ready">0</strong></button>
      <button class="stat" id="tab-out" onclick="selectTab('출고차량')"><small>출고차량</small><strong id="count-out">0</strong></button>
      <button class="stat" id="tab-reserved" onclick="selectTab('예약차량')"><small>예약차량</small><strong id="count-reserved">0</strong></button>
    </div>

    <div class="toolbar" id="toolbar">
      <div>
        <div class="toolbar-left-title" id="toolbarTitle">차량 목록</div>
        <div class="toolbar-left-sub">차량을 눌러 상세정보를 확인할 수 있습니다.</div>
      </div>
      <div class="toolbar-right">
        <input id="searchInput" class="search" type="text" placeholder="차종 또는 차량번호 검색" oninput="renderVehicles()" />
        <button class="btn btn-outline" onclick="goHome()">처음화면</button>
      </div>
    </div>

    <div class="card" id="vehicleCard">
      <div class="card-title">차량 목록</div>
      <div class="vehicle-grid" id="vehicleList"></div>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="detailModel"></div>
          <div class="modal-sub" id="detailNumber"></div>
        </div>
        <div id="detailBadge"></div>
      </div>

      <div class="info-grid">
        <div class="info-box"><div class="label">차종</div><div class="value" id="infoModel"></div></div>
        <div class="info-box"><div class="label">차량번호</div><div class="value" id="infoNumber"></div></div>
        <div class="info-box"><div class="label">유종</div><div class="value" id="infoFuel"></div></div>
        <div class="info-box"><div class="label">보험</div><div class="value" id="infoInsurance"></div></div>
        <div class="info-box"><div class="label">유류량</div><div class="value" id="infoFuelLevel"></div></div>
        <div class="info-box"><div class="label">운전자 연령</div><div class="value" id="infoDriverAge"></div></div>
        <div class="info-box full"><div class="label">최신 상태</div><div class="value" id="infoStatus"></div></div>
        <div class="info-box full" id="infoNoteBox" style="display:none;"><div class="label">메모</div><div class="value" id="infoNote"></div></div>
      </div>

      <button class="btn btn-primary" style="width:100%;" onclick="closeDetail()">닫기</button>
    </div>
  </div>

  <div class="modal" id="formModal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="formTitle">차량 추가</div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>차종</label>
          <input id="formModel" placeholder="예: K5" />
        </div>
        <div class="form-group">
          <label>차량번호</label>
          <input id="formNumber" placeholder="예: 123하4567" />
        </div>
        <div class="form-two">
          <div class="form-group">
            <label>유종</label>
            <select id="formFuel">
              <option>가솔린</option>
              <option>디젤</option>
              <option>LPG</option>
              <option>하이브리드</option>
              <option>전기</option>
            </select>
          </div>
          <div class="form-group">
            <label>보험</label>
            <input id="formInsurance" />
          </div>
        </div>
        <div class="form-two">
          <div class="form-group">
            <label>운전자연령</label>
            <input id="formDriverAge" />
          </div>
          <div class="form-group">
            <label>상태</label>
            <select id="formStatus">
              <option>대기차량</option>
              <option>출고차량</option>
              <option>예약차량</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>유류량</label>
          <select id="formFuelLevel">
            <option>10%</option>
            <option>20%</option>
            <option>30%</option>
            <option>40%</option>
            <option>50%</option>
            <option>60%</option>
            <option>70%</option>
            <option>80%</option>
            <option>90%</option>
            <option>100%</option>
          </select>
        </div>
        <div class="form-group">
          <label>메모</label>
          <input id="formNote" placeholder="간단 메모" />
        </div>
      </div>

      <div class="form-actions">
        <div>
          <button class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteVehicle()">삭제</button>
        </div>
        <div class="form-actions-right">
          <button class="btn btn-outline" onclick="closeForm()">취소</button>
          <button class="btn btn-primary" onclick="saveVehicle()">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuRrSsYXv127tT8qBXGE0Yl3L01DUEx5o",
  authDomain: "joongboocar.firebaseapp.com",
  projectId: "joongboocar",
  storageBucket: "joongboocar.firebasestorage.app",
  messagingSenderId: "888402974013",
  appId: "1:888402974013:web:4100b87a36889553e4e154"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const vehiclesRef = collection(db, "vehicles");

let vehicles = [];
let selectedTab = null;
let selectedVehicleId = null;
let editingId = null;

function nowStamp() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  return `${y}-${m}-${d} ${hh}:${mm}`;
}

function badgeClass(status) {
  if (status === "대기차량") return "badge bg-ready";
  if (status === "예약차량") return "badge bg-reserved";
  return "badge bg-out";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function renderStats() {
  const validVehicles = vehicles.filter(v => v.model && v.number);
  const total = validVehicles.length;
  const ready = validVehicles.filter(v => v.status === "대기차량").length;
  const out = validVehicles.filter(v => v.status === "출고차량").length;
  const reserved = validVehicles.filter(v => v.status === "예약차량").length;

  document.getElementById("count-all").textContent = total;
  document.getElementById("count-ready").textContent = ready;
  document.getElementById("count-out").textContent = out;
  document.getElementById("count-reserved").textContent = reserved;
}

function paintActiveTab() {
  document.getElementById("tab-all").className =
    "stat" + (selectedTab === "전체" ? " active-all" : "");
  document.getElementById("tab-ready").className =
    "stat" + (selectedTab === "대기차량" ? " active-ready" : "");
  document.getElementById("tab-out").className =
    "stat" + (selectedTab === "출고차량" ? " active-out" : "");
  document.getElementById("tab-reserved").className =
    "stat" + (selectedTab === "예약차량" ? " active-reserved" : "");
}

function renderVehicles() {
  const list = document.getElementById("vehicleList");
  const q = document.getElementById("searchInput").value.trim().toLowerCase();

  let filtered = vehicles.filter(v => v.model && v.number);

  if (selectedTab && selectedTab !== "전체") {
    filtered = filtered.filter(v => v.status === selectedTab);
  }

  if (q) {
    filtered = filtered.filter(v =>
      (v.model || "").toLowerCase().includes(q) ||
      (v.number || "").toLowerCase().includes(q)
    );
  }

  if (!selectedTab) {
    list.innerHTML = "";
    return;
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="muted-empty">검색 결과가 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(vehicle => `
    <div class="vehicle-item">
      <div class="vehicle-top">
        <div>
          <div class="vehicle-model">${escapeHtml(vehicle.model || "")}</div>
          <div class="vehicle-number">${escapeHtml(vehicle.number || "")}</div>
        </div>
        <div class="${badgeClass(vehicle.status)}">${escapeHtml(vehicle.status || "")}</div>
      </div>
      <div class="vehicle-meta">
        <span>${escapeHtml(vehicle.fuel || "")}</span>
        <span>업데이트 ${escapeHtml(vehicle.updatedAt || "")}</span>
      </div>
      <div class="vehicle-actions">
        <button class="btn btn-outline" onclick="openDetail('${vehicle.id}')">상세보기</button>
        <button class="btn btn-outline" onclick="openForm('${vehicle.id}')">변경</button>
      </div>
    </div>
  `).join("");
}

function selectTab(tab) {
  if (selectedTab === tab) {
    goHome();
    return;
  }

  selectedTab = tab;
  paintActiveTab();

  document.getElementById("toolbar").classList.add("show");
  document.getElementById("vehicleCard").classList.add("show");
  document.getElementById("toolbarTitle").textContent =
    tab === "전체" ? "전체차량 목록" : `${tab} 목록`;

  renderVehicles();
}

function openDetail(id) {
  const vehicle = vehicles.find(v => v.id === id);
  if (!vehicle) return;

  selectedVehicleId = id;

  document.getElementById("detailModel").textContent = vehicle.model || "";
  document.getElementById("detailNumber").textContent = vehicle.number || "";
  document.getElementById("detailBadge").innerHTML =
    `<div class="${badgeClass(vehicle.status)}">${escapeHtml(vehicle.status || "")}</div>`;

  document.getElementById("infoModel").textContent = vehicle.model || "";
  document.getElementById("infoNumber").textContent = vehicle.number || "";
  document.getElementById("infoFuel").textContent = vehicle.fuel || "";
  document.getElementById("infoInsurance").textContent = vehicle.insurance || "";
  document.getElementById("infoFuelLevel").textContent = vehicle.fuelLevel || "";
  document.getElementById("infoDriverAge").textContent = vehicle.driverAge || "";
  document.getElementById("infoStatus").textContent = vehicle.status || "";

  if (vehicle.note) {
    document.getElementById("infoNoteBox").style.display = "block";
    document.getElementById("infoNote").textContent = vehicle.note;
  } else {
    document.getElementById("infoNoteBox").style.display = "none";
    document.getElementById("infoNote").textContent = "";
  }

  document.getElementById("detailModal").classList.add("show");
}

function closeDetail() {
  document.getElementById("detailModal").classList.remove("show");
}

function openForm(id = null) {
  editingId = id;
  document.getElementById("formTitle").textContent = id ? "차량 정보 변경" : "차량 추가";
  document.getElementById("deleteBtn").style.display = id ? "inline-block" : "none";

  const vehicle = vehicles.find(v => v.id === id);

  document.getElementById("formModel").value = vehicle ? (vehicle.model || "") : "";
  document.getElementById("formNumber").value = vehicle ? (vehicle.number || "") : "";
  document.getElementById("formFuel").value = vehicle ? (vehicle.fuel || "가솔린") : "가솔린";
  document.getElementById("formInsurance").value = vehicle ? (vehicle.insurance || "종합보험") : "종합보험";
  document.getElementById("formDriverAge").value = vehicle ? (vehicle.driverAge || "만 26세 이상") : "만 26세 이상";
  document.getElementById("formStatus").value = vehicle ? (vehicle.status || "대기차량") : "대기차량";
  document.getElementById("formFuelLevel").value = vehicle ? (vehicle.fuelLevel || "100%") : "100%";
  document.getElementById("formNote").value = vehicle ? (vehicle.note || "") : "";

  document.getElementById("formModal").classList.add("show");
  closeDetail();
}

function closeForm() {
  document.getElementById("formModal").classList.remove("show");
}

async function saveVehicle() {
  const model = document.getElementById("formModel").value.trim();
  const number = document.getElementById("formNumber").value.trim();
  const fuel = document.getElementById("formFuel").value;
  const insurance = document.getElementById("formInsurance").value.trim();
  const driverAge = document.getElementById("formDriverAge").value.trim();
  const status = document.getElementById("formStatus").value;
  const fuelLevel = document.getElementById("formFuelLevel").value;
  const note = document.getElementById("formNote").value.trim();
  const updatedAt = nowStamp();

  if (!model || !number) {
    alert("차종이랑 차량번호는 입력해야 함");
    return;
  }

  const payload = {
    model,
    number,
    fuel,
    insurance,
    driverAge,
    status,
    fuelLevel,
    note,
    updatedAt
  };

  try {
    if (editingId) {
      await updateDoc(doc(db, "vehicles", editingId), payload);
    } else {
      await addDoc(vehiclesRef, payload);
    }
    closeForm();
  } catch (err) {
    console.error(err);
    alert("저장 중 오류가 났습니다.");
  }
}

async function deleteVehicle() {
  if (!editingId) return;

  if (!confirm("삭제할까요?")) return;

  try {
    await deleteDoc(doc(db, "vehicles", editingId));
    closeForm();
  } catch (err) {
    console.error(err);
    alert("삭제 중 오류가 났습니다.");
  }
}

function goHome() {
  selectedTab = null;
  selectedVehicleId = null;
  document.getElementById("searchInput").value = "";
  document.getElementById("toolbar").classList.remove("show");
  document.getElementById("vehicleCard").classList.remove("show");
  document.getElementById("detailModal").classList.remove("show");
  paintActiveTab();
}

window.onclick = function (e) {
  if (e.target.id === "detailModal") closeDetail();
  if (e.target.id === "formModal") closeForm();
};

window.selectTab = selectTab;
window.openDetail = openDetail;
window.closeDetail = closeDetail;
window.openForm = openForm;
window.closeForm = closeForm;
window.saveVehicle = saveVehicle;
window.deleteVehicle = deleteVehicle;
window.goHome = goHome;

onSnapshot(vehiclesRef, (snapshot) => {
  vehicles = snapshot.docs
    .map(d => ({
      id: d.id,
      ...d.data()
    }))
    .filter(v =>
      v.status === "대기차량" ||
      v.status === "출고차량" ||
      v.status === "예약차량"
    )
    .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));

  renderStats();
  renderVehicles();

  if (selectedVehicleId) {
    const current = vehicles.find(v => v.id === selectedVehicleId);
    if (current) {
      document.getElementById("detailModel").textContent = current.model || "";
      document.getElementById("detailNumber").textContent = current.number || "";
      document.getElementById("detailBadge").innerHTML =
        `<div class="${badgeClass(current.status)}">${escapeHtml(current.status || "")}</div>`;
      document.getElementById("infoModel").textContent = current.model || "";
      document.getElementById("infoNumber").textContent = current.number || "";
      document.getElementById("infoFuel").textContent = current.fuel || "";
      document.getElementById("infoInsurance").textContent = current.insurance || "";
      document.getElementById("infoFuelLevel").textContent = current.fuelLevel || "";
      document.getElementById("infoDriverAge").textContent = current.driverAge || "";
      document.getElementById("infoStatus").textContent = current.status || "";
      if (current.note) {
        document.getElementById("infoNoteBox").style.display = "block";
        document.getElementById("infoNote").textContent = current.note;
      } else {
        document.getElementById("infoNoteBox").style.display = "none";
        document.getElementById("infoNote").textContent = "";
      }
    } else {
      closeDetail();
    }
  }
});

paintActiveTab();
renderStats();
  </script>
</body>
</html>
