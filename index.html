<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사고대차 차량 관리앱</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --navy: #14203a;
      --blue: #1d4ed8;
      --soft-blue: #eef4ff;
      --green: #13b86a;
      --orange: #f59e0b;
      --purple: #8b5cf6;
      --red: #ef4444;
      --text: #101828;
      --muted: #667085;
      --line: #e5eaf3;
      --card: rgba(255,255,255,0.92);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 80% 8%, rgba(29,78,216,0.16) 0%, transparent 24%),
        radial-gradient(circle at 8% 0%, rgba(59,130,246,0.08) 0%, transparent 26%),
        linear-gradient(180deg, #f7faff 0%, #f3f6fb 46%, #f8fafc 100%);
      color: var(--text);
    }

    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 18px 34px; }

    .hero {
      position: relative;
      min-height: 270px;
      padding: 10px 8px 0;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      right: -8px;
      top: 58px;
      width: 340px;
      height: 210px;
      background:
        radial-gradient(circle at 44% 54%, rgba(37,99,235,0.38), transparent 38%),
        linear-gradient(135deg, rgba(96,165,250,0.10), rgba(37,99,235,0.03));
      filter: blur(1px);
      border-radius: 40px;
      opacity: .9;
      pointer-events: none;
    }

    .hero-illust {
      position: absolute;
      right: 10px;
      top: 74px;
      width: 310px;
      height: 190px;
      opacity: .55;
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #263858;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-top: 6px;
    }

    .brand-dot {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #2563eb;
      border: 5px solid #dbe8ff;
      box-shadow: 0 8px 18px rgba(37,99,235,.28);
    }

    .hero-title {
      margin: 46px 0 16px;
      font-size: 52px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -2px;
      color: #14203a;
      position: relative;
      z-index: 2;
    }

    .hero-sub {
      margin: 0;
      color: #667493;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.6px;
      position: relative;
      z-index: 2;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      transition: .16s ease;
      white-space: nowrap;
    }

    .btn:active { transform: scale(.98); }
    .btn-primary { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: white; box-shadow: 0 14px 28px rgba(29,78,216,.22); }
    .btn-outline { background: white; color: #263858; border: 1px solid #d9e1ee; box-shadow: 0 8px 20px rgba(16,24,40,.04); }
    .btn-danger { background: #dc2626; color: white; }
    .btn-add { padding: 18px 28px; border-radius: 17px; font-size: 19px; display:flex; align-items:center; gap:10px; }

    .home-filter {
      background: var(--card);
      border-radius: 30px;
      padding: 30px 36px;
      margin: 4px 0 28px;
      box-shadow: 0 18px 46px rgba(16,24,40,.08);
      border: 1px solid rgba(255,255,255,.8);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 5;
    }

    .home-filter.hide { display: none; }
    .home-filter-title { display:flex; align-items:center; gap:12px; color:#111c34; font-size:24px; font-weight:950; margin-bottom:24px; letter-spacing:-0.7px; }
    .home-filter-title svg { color:#1d4ed8; }
    .home-filter-row { display: grid; grid-template-columns: 1fr auto auto; gap: 28px; align-items: center; }

    .date-wrap { position:relative; }
    .date-filter, .search, .form-group input, .form-group select {
      width: 100%;
      background: white;
      border: 2px solid #e0e7f1;
      border-radius: 15px;
      padding: 15px 17px;
      font-size: 16px;
      color: #111827;
      outline: none;
    }
    .date-filter:focus, .search:focus, .form-group input:focus, .form-group select:focus { border-color:#93b4ff; box-shadow:0 0 0 4px rgba(37,99,235,.08); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }

    .stat {
      width: 100%;
      min-height: 178px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      padding: 28px 34px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 18px 42px rgba(16,24,40,.07);
      display: grid;
      grid-template-columns: 140px 1fr 24px;
      align-items: center;
      gap: 26px;
      cursor: pointer;
      text-align: left;
      transition: .18s ease;
    }

    .stat:hover { transform: translateY(-2px); box-shadow: 0 20px 48px rgba(16,24,40,.10); }
    .stat-icon { width: 118px; height: 118px; border-radius: 50%; display:flex; align-items:center; justify-content:center; }
    .stat-icon svg { width: 48px; height: 48px; }
    .icon-all { background:#edf3ff; color:#2563eb; }
    .icon-ready { background:#eafaf1; color:#14b86a; }
    .icon-out { background:#fff4e5; color:#f59e0b; }
    .icon-reserved { background:#f4eaff; color:#8b5cf6; }
    .icon-unavailable { background:#fff0f0; color:#ef4444; }
    .icon-completed { background:#ecfeff; color:#0891b2; }

    .stat-label { font-size: 21px; font-weight: 950; color:#18243d; letter-spacing:-.7px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .stat-count { margin: 14px 0 12px; display:flex; align-items:center; gap:9px; }
    .stat-count strong { font-size: 50px; line-height:1; color:#101828; letter-spacing:-1.6px; }
    .unit { font-size:18px; font-weight:950; padding:7px 10px; border-radius:13px; }
    .unit-blue { background:#dfeaff; color:#2457d6; }
    .unit-green { background:#dcfce7; color:#119654; }
    .unit-orange { background:#fff0d8; color:#e98400; }
    .unit-purple { background:#eee2ff; color:#854ee8; }
    .unit-red { background:#fee2e2; color:#dc2626; }
    .unit-completed { background:#cffafe; color:#0e7490; }
    .stat-desc { color:#72809c; font-size:17px; font-weight:800; letter-spacing:-.5px; }
    .reserved-note { font-size:15px; color:#3f4f70; font-weight:950; }
    .chev { color:#667085; font-size:42px; font-weight:300; }

    .active-all, .active-ready, .active-out, .active-reserved, .active-unavailable, .active-completed { outline: 3px solid rgba(37,99,235,.13); }

    .toolbar { display: none; gap: 14px; align-items: flex-start; justify-content: space-between; margin: 4px 0 16px; }
    .toolbar.show { display: flex; }
    .toolbar-left-title { font-size: 25px; font-weight: 950; letter-spacing: -0.8px; color:#14203a; }
    .toolbar-left-sub { font-size: 14px; color: #667493; margin-top: 6px; font-weight:700; }
    .toolbar-right { display: flex; gap: 10px; flex-wrap: wrap; min-width: 360px; flex: 1; justify-content: flex-end; }
    .search { max-width: 420px; }

    .card { display: none; background: rgba(255,255,255,.92); border-radius: 28px; padding: 18px; box-shadow: 0 18px 42px rgba(16,24,40,.07); border:1px solid rgba(255,255,255,.9); }
    .card.show { display: block; }
    .card-title { font-size: 22px; font-weight: 950; margin: 4px 0 16px; color:#14203a; }

    .vehicle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(275px, 1fr)); gap: 14px; }
    .vehicle-item { border: 1px solid #e8eef7; border-radius: 24px; padding: 17px; background: #fff; box-shadow: 0 10px 24px rgba(16,24,40,.05); transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; scroll-margin-top: 18px; }
    .vehicle-item.search-hit { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.12), 0 14px 30px rgba(37,99,235,.16); transform: translateY(-1px); }
    .vehicle-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .vehicle-model { font-weight: 950; font-size: 20px; color:#14203a; }
    .vehicle-number { font-size: 14px; color: #667493; margin-top: 4px; font-weight:800; }

    .badge { padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 950; white-space: nowrap; border: 1px solid transparent; }
    .bg-ready { background: #dcfce7; color: #047857; border-color: #bbf7d0; }
    .bg-out { background: #fff0d8; color: #b45309; border-color: #fde68a; }
    .bg-reserved { background: #eee2ff; color: #7c3aed; border-color: #ddd6fe; }
    .bg-unavailable { background:#fee2e2; color:#dc2626; border-color:#fecaca; }
    .bg-completed { background:#cffafe; color:#0e7490; border-color:#a5f3fc; }

    .vehicle-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
    .vehicle-meta-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; padding: 10px 9px; min-height: 60px; }
    .vehicle-meta-box.full { grid-column: 1 / -1; }
    .vehicle-meta-label { display: block; font-size: 11px; color: #667493; font-weight: 950; margin-bottom: 5px; }
    .vehicle-meta-value { display: block; font-size: 14px; color: #101828; font-weight: 950; line-height: 1.28; word-break: break-word; }
    .vehicle-actions { display: flex; gap: 8px; margin-top: 13px; }
    .vehicle-actions .btn { flex: 1; }

    .muted-empty { grid-column: 1/-1; text-align: center; color: #667493; padding: 28px 10px; border: 1px dashed #cbd5e1; border-radius: 18px; background: #f8fafc; font-weight:800; }

    .modal { position: fixed; inset: 0; background: rgba(15,23,42,.52); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
    .modal.show { display: flex; }
    .modal-box { width: 100%; max-width: 590px; max-height: 90vh; overflow: auto; background: white; border-radius: 28px; padding: 20px; box-shadow:0 24px 70px rgba(0,0,0,.22); }
    .modal-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 16px; }
    .modal-title { font-size: 24px; font-weight: 950; color:#14203a; letter-spacing:-.8px; }
    .modal-sub { font-size: 14px; color: #667493; margin-top: 4px; font-weight:800; }

    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
    .info-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; }
    .info-box.full { grid-column: 1 / -1; }
    .label { font-size: 12px; color: #667493; margin-bottom: 6px; font-weight:900; }
    .value { font-size: 15px; font-weight: 900; color:#101828; word-break:break-word; }

    .form-grid { display: grid; gap: 12px; }
    .form-two { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 950; margin-bottom: 7px; color:#263858; }
    .form-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .form-actions-right { display: flex; gap: 8px; flex-wrap: wrap; }
    .schedule-extra, .unavailable-extra { display: none; }
    .schedule-extra.show, .unavailable-extra.show { display: block; }
    .form-two.schedule-extra.show { display:grid; }

    @media (max-width: 700px) {
      .wrap { padding: 16px 12px 28px; }
      .hero { min-height: 245px; }
      .hero-title { font-size: 45px; margin-top: 42px; }
      .hero-sub { font-size: 17px; }
      .hero-illust { width: 260px; right:-32px; opacity:.42; }
      .btn-add { padding: 15px 19px; font-size: 16px; }
      .home-filter { padding: 24px 18px; border-radius: 27px; }
      .home-filter-row { grid-template-columns: 1fr; gap: 10px; }
      .stat { grid-template-columns: 95px 1fr 18px; padding: 22px 20px; min-height: 148px; gap: 18px; }
      .stat-icon { width: 88px; height: 88px; }
      .stat-icon svg { width: 38px; height: 38px; }
      .stat-count strong { font-size: 44px; }
      .stat-label { font-size: 19px; }
      .stat-desc { font-size: 14px; }
      .toolbar { flex-direction: column; }
      .toolbar-right { min-width: 0; width: 100%; justify-content: stretch; }
      .search { max-width: none; }
      .info-grid, .form-two { grid-template-columns: 1fr; }
      .vehicle-meta { grid-template-columns: 1fr; }
    }

    /* 모바일 앱 화면 최적화: 메인화면 한눈에 들어오도록 축소 */
    @media (max-width: 700px) {
      .wrap { padding: 10px 10px 20px; }
      .hero { min-height: 118px; padding: 6px 2px 0; }
      .brand { font-size: 14px; gap: 8px; margin-top: 2px; }
      .brand-dot { width: 14px; height: 14px; border-width: 4px; }
      .hero-title { font-size: 34px; margin: 24px 0 0; letter-spacing: -1.5px; }
      .hero-sub { display: none; }
      .hero::before { width: 180px; height: 115px; right: -50px; top: 38px; opacity: .42; }
      .hero-illust { width: 165px; height: 105px; right: -34px; top: 42px; opacity: .28; }
      .btn { border-radius: 13px; padding: 11px 13px; font-size: 14px; }
      .btn-add { padding: 12px 14px; font-size: 14px; border-radius: 13px; gap: 7px; }
      .btn-add svg { width: 18px; height: 18px; }

      .home-filter { padding: 14px; border-radius: 20px; margin: 0 0 12px; box-shadow: 0 10px 26px rgba(16,24,40,.06); }
      .home-filter-title { font-size: 17px; margin-bottom: 10px; gap: 8px; }
      .home-filter-title svg { width: 18px; height: 18px; }
      .home-filter-row { grid-template-columns: 1fr auto auto; gap: 7px; }
      .date-filter, .search, .form-group input, .form-group select { padding: 11px 12px; font-size: 14px; border-radius: 12px; border-width: 1px; }
      .home-filter-row .btn { padding: 11px 12px; }

      .grid { gap: 10px; }
      .stat { min-height: 82px; grid-template-columns: 56px 1fr 12px; padding: 12px 14px; gap: 12px; border-radius: 20px; box-shadow: 0 10px 24px rgba(16,24,40,.055); }
      .stat:hover { transform: none; }
      .stat-icon { width: 54px; height: 54px; }
      .stat-icon svg { width: 25px; height: 25px; }
      .stat-label { font-size: 15px; letter-spacing: -.4px; gap: 6px; }
      .stat-count { margin: 5px 0 0; gap: 6px; }
      .stat-count strong { font-size: 29px; letter-spacing: -1px; }
      .unit { font-size: 12px; padding: 4px 7px; border-radius: 9px; }
      .reserved-note { font-size: 11px; }
      .chev { font-size: 28px; }

      .toolbar { margin-top: 6px; gap: 8px; }
      .toolbar-left-title { font-size: 20px; }
      .toolbar-left-sub { display: none; }
      .toolbar-right { gap: 7px; }
      .toolbar-right .btn { flex: 0 0 auto; }
      .search { flex: 1; }
      .card { border-radius: 20px; padding: 12px; }
      .card-title { font-size: 18px; margin-bottom: 10px; }
      .vehicle-grid { grid-template-columns: 1fr; gap: 10px; }
      .vehicle-item { border-radius: 18px; padding: 13px; }
      .vehicle-model { font-size: 17px; }
      .vehicle-number { font-size: 13px; }
      .vehicle-meta { gap: 7px; margin-top: 10px; }
      .vehicle-meta-box { min-height: auto; padding: 8px 9px; border-radius: 12px; }
      .vehicle-actions { margin-top: 10px; }
      .modal { padding: 10px; }
      .modal-box { border-radius: 22px; padding: 16px; max-height: 92vh; }
    }


    /* 최종수정: 메인 상단 구간 위치/크기 재조정 */
    .hero { min-height: 205px; padding: 8px 8px 0; }
    .hero-top { align-items: center; }
    .brand { margin-top: 0; font-size: 18px; }
    .hero-title { margin: 34px 0 0; font-size: 48px; }
    .btn-add { padding: 16px 24px; font-size: 17px; }
    .hero::before { top: 42px; right: 0; width: 300px; height: 180px; }
    .hero-illust { top: 58px; right: 8px; width: 275px; height: 170px; opacity: .46; }

    @media (max-width: 700px) {
      .hero { min-height: 92px; padding: 2px 0 0; }
      .hero-top { align-items: center; }
      .brand { font-size: 13px; gap: 7px; }
      .brand-dot { width: 12px; height: 12px; border-width: 3px; }
      .hero-title { font-size: 30px; margin: 17px 0 0; letter-spacing: -1.4px; }
      .btn-add { padding: 10px 12px; font-size: 13px; border-radius: 12px; }
      .hero::before { width: 142px; height: 86px; right: -44px; top: 28px; opacity: .28; }
      .hero-illust { width: 132px; height: 84px; right: -30px; top: 32px; opacity: .18; }
    }


    /* 마지막 수정: 상단 브랜드/제목/차량추가 위치 조정 */
    .hero { min-height: 168px; padding: 12px 8px 0; }
    .hero-top { display:block; margin-top: 52px; }
    .brand { margin-top: 0; font-size: 18px; gap: 10px; }
    .brand-dot { width: 16px; height: 16px; border-width: 4px; }
    .hero-title { margin: 8px 0 0; font-size: 48px; }
    .hero::before { top: 36px; right: 0; width: 290px; height: 165px; }
    .hero-illust { top: 52px; right: 8px; width: 260px; height: 158px; opacity: .42; }
    .add-area { display:flex; justify-content:flex-end; align-items:center; margin: 0 0 10px; position:relative; z-index:6; }
    .add-area .btn-add { padding: 14px 22px; font-size: 16px; border-radius: 16px; }

    @media (max-width: 700px) {
      .hero { min-height: 82px; padding: 0 2px; }
      .hero-top { margin-top: 18px; }
      .brand { font-size: 13px; gap: 7px; }
      .brand-dot { width: 12px; height: 12px; border-width: 3px; }
      .hero-title { font-size: 30px; margin: 5px 0 0; letter-spacing: -1.4px; }
      .hero::before { width: 132px; height: 80px; right: -42px; top: 24px; opacity: .25; }
      .hero-illust { width: 122px; height: 78px; right: -30px; top: 29px; opacity: .16; }
      .add-area { margin: 0 0 8px; }
      .add-area .btn-add { width: 100%; justify-content:center; padding: 11px 12px; font-size: 14px; border-radius: 13px; }
    }


    /* 진짜 최종: 차량추가 우측 상단 소형 복구 + 브랜드/제목 자연스럽게 하향 + 글씨 두께 완화 */
    .hero { min-height: 145px; padding: 8px 8px 0; }
    .hero-top { display:block; margin-top: 46px; }
    .add-area { position:absolute; top: 8px; right: 8px; margin:0; z-index:8; display:flex; justify-content:flex-end; }
    .add-area .btn-add { width:auto; justify-content:center; padding: 10px 13px; font-size: 14px; border-radius: 13px; gap:6px; }
    .add-area .btn-add svg { width:18px; height:18px; }
    .brand { font-size: 16px; font-weight: 650; gap: 8px; margin:0; }
    .brand-dot { width: 13px; height: 13px; border-width: 3px; }
    .hero-title { margin: 6px 0 0; font-size: 43px; font-weight: 720; letter-spacing: -1.6px; }
    .hero::before { top: 34px; right: -4px; width: 250px; height: 145px; opacity:.34; }
    .hero-illust { top: 48px; right: -4px; width: 230px; height: 140px; opacity: .24; }

    .btn { font-weight: 650; }
    .home-filter-title,
    .stat-label,
    .toolbar-left-title,
    .card-title,
    .vehicle-model,
    .badge,
    .modal-title,
    .form-group label { font-weight: 700; }
    .stat-desc,
    .vehicle-number,
    .toolbar-left-sub,
    .modal-sub,
    .muted-empty { font-weight: 500; }
    .stat-count strong { font-weight: 720; }
    .unit,
    .reserved-note,
    .vehicle-meta-label,
    .vehicle-meta-value,
    .label,
    .value { font-weight: 650; }

    @media (max-width: 700px) {
      .hero { min-height: 106px; padding: 4px 2px 0; }
      .add-area { top: 2px; right: 2px; }
      .add-area .btn-add { width:auto; padding: 8px 10px; font-size: 12px; border-radius: 11px; gap:5px; }
      .hero-top { margin-top: 31px; }
      .brand { font-size: 13px; font-weight: 600; gap: 7px; }
      .brand-dot { width: 11px; height: 11px; border-width: 3px; }
      .hero-title { font-size: 31px; margin: 5px 0 0; font-weight: 700; letter-spacing: -1.3px; }
      .hero::before { width: 128px; height: 78px; right: -40px; top: 28px; opacity: .20; }
      .hero-illust { width: 120px; height: 76px; right: -30px; top: 34px; opacity: .12; }
    }




    /* 재수정: 폰 첫 화면에서 한눈에 보이되 너무 압축되지 않게 균형 조정 */
    .wrap { max-width: 900px; }
    .hero { min-height: 138px; }
    .hero-top { margin-top: 42px; }
    .hero-title { font-size: 41px; margin-top: 6px; }
    .home-filter { padding: 18px 22px; margin: 0 0 15px; border-radius: 22px; }
    .home-filter-title { font-size: 19px; margin-bottom: 13px; }
    .grid { gap: 12px; }
    .stat {
      min-height: 118px;
      padding: 18px 24px;
      border-radius: 24px;
      grid-template-columns: 84px 1fr 18px;
      gap: 18px;
    }
    .stat-icon { width: 76px; height: 76px; }
    .stat-icon svg { width: 34px; height: 34px; }
    .stat-count { margin: 7px 0 0; }
    .stat-count strong { font-size: 38px; }
    .stat-label { font-size: 18px; }
    .stat-desc { display: none; }
    .chev { font-size: 32px; }

    @media (max-width: 700px) {
      .wrap { padding: 10px 10px 22px; }
      .hero { min-height: 98px; padding: 4px 2px 0; }
      .add-area { top: 3px; right: 2px; }
      .add-area .btn-add { width:auto; padding: 9px 11px; font-size: 12.5px; border-radius: 11px; gap:5px; }
      .add-area .btn-add svg { width: 17px; height: 17px; }
      .hero-top { margin-top: 30px; }
      .brand { font-size: 13px; font-weight: 600; gap: 7px; }
      .brand-dot { width: 11px; height: 11px; border-width: 3px; }
      .hero-title { font-size: 31px; margin: 5px 0 0; font-weight: 700; letter-spacing: -1.3px; }
      .hero::before { width: 126px; height: 78px; right: -38px; top: 28px; opacity: .18; }
      .hero-illust { width: 116px; height: 74px; right: -28px; top: 34px; opacity: .10; }

      .home-filter { padding: 12px; margin: 0 0 10px; border-radius: 17px; box-shadow: 0 9px 22px rgba(16,24,40,.055); }
      .home-filter-title { font-size: 15px; margin-bottom: 8px; gap: 6px; }
      .home-filter-title svg { width: 17px; height: 17px; }
      .home-filter-row { grid-template-columns: 1fr auto auto; gap: 6px; }
      .date-filter, .search, .form-group input, .form-group select { padding: 10px 11px; font-size: 13.5px; border-radius: 11px; border-width: 1px; }
      .home-filter-row .btn { padding: 10px 10px; font-size: 12.5px; border-radius: 11px; }

      .grid { gap: 8px; }
      .stat {
        min-height: 78px;
        grid-template-columns: 50px 1fr 12px;
        padding: 11px 13px;
        gap: 11px;
        border-radius: 18px;
        box-shadow: 0 10px 24px rgba(16,24,40,.055);
      }
      .stat-icon { width: 48px; height: 48px; }
      .stat-icon svg { width: 23px; height: 23px; }
      .stat-label { font-size: 15px; line-height: 1.18; }
      .stat-count { margin: 4px 0 0; gap: 6px; }
      .stat-count strong { font-size: 27px; }
      .unit { font-size: 11.5px; padding: 3px 6px; border-radius: 8px; }
      .reserved-note { font-size: 10.5px; }
      .chev { font-size: 24px; }
    }

  </style>
</head>
<body>

          <div class="form-group"><label>대차 차종</label><input id="formModel" placeholder="예: K5" /></div>
          <div class="form-group"><label>대차 차량번호</label><input id="formNumber" placeholder="예: 123하4567" /></div>
        </div>
        <div class="form-two">
          <div class="form-group"><label>유종</label><select id="formFuel"><option>가솔린</option><option>디젤</option><option>LPG</option><option>하이브리드</option><option>전기</option></select></div>

          <div class="form-group"><label>상태</label><select id="formStatus" onchange="toggleFields()"><option>대기차량</option><option>출고차량</option><option>예약차량</option><option>출고불가차량</option></select></div>

          <div class="form-group"><label>입고일자</label><input id="formReceivedDate" type="date" /></div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuRrSsYXv127tT8qBXGE0Yl3L01DUEx5o",
  authDomain: "joongboocar.firebaseapp.com",
  projectId: "joongboocar",
  storageBucket: "joongboocar.firebasestorage.app",
  messagingSenderId: "888402974013",
  appId: "1:888402974013:web:4100b87a36889553e4e154"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const vehiclesRef = collection(db, "vehicles");

let vehicles = [];
let selectedTab = null;
let selectedVehicleId = null;
let editingId = null;
let searchMatchId = null;

function nowStamp() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  return `${y}-${m}-${d} ${hh}:${mm}`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

function badgeClass(status) {
  if (status === "대기차량") return "badge bg-ready";
  if (status === "예약차량") return "badge bg-reserved";
  if (status === "출고불가차량") return "badge bg-unavailable";
  if (status === "출고완료차량") return "badge bg-completed";
  return "badge bg-out";
}

function usesScheduleInfo(status) {
  return status === "출고차량" || status === "예약차량" || status === "출고완료차량";
}

function isUnavailable(status) {
  return status === "출고불가차량";
}

function normalizeDateValue(value) {
  if (!value) return "";
  return String(value).trim().slice(0, 10);
}

function splitLegacyAccident(v) {
  const legacy = String(v.accidentVehicle || "").trim();
  if (!legacy) return { model: "", number: "" };
  const parts = legacy.split(/\s+/);
  if (parts.length >= 2 && /\d/.test(parts[parts.length - 1])) {
    return { model: parts.slice(0, -1).join(" "), number: parts[parts.length - 1] };
  }
  return { model: legacy, number: "" };
}

function accidentModelOf(v) {
  return v.accidentModel || v.accidentVehicleModel || splitLegacyAccident(v).model || "";
}

function accidentNumberOf(v) {
  return v.accidentNumber || v.accidentVehicleNumber || splitLegacyAccident(v).number || "";
}

function accidentTextOf(v) {
  const model = accidentModelOf(v);
  const number = accidentNumberOf(v);
  const legacy = v.accidentVehicle || "";
  return [model, number].filter(Boolean).join(" ") || legacy;
}

function setInfoBox(boxId, valueId, value) {
  const box = document.getElementById(boxId);
  const target = document.getElementById(valueId);
  if (value) { box.style.display = "block"; target.textContent = value; }
  else { box.style.display = "none"; target.textContent = ""; }
}

function fillDetail(vehicle) {
  document.getElementById("detailModel").textContent = vehicle.model || "";
  document.getElementById("detailNumber").textContent = vehicle.number || "";
  document.getElementById("detailBadge").innerHTML = `<div class="${badgeClass(vehicle.status)}">${escapeHtml(vehicle.status || "")}</div>`;
  document.getElementById("infoModel").textContent = vehicle.model || "";
  document.getElementById("infoNumber").textContent = vehicle.number || "";
  document.getElementById("infoFuel").textContent = vehicle.fuel || "";
  document.getElementById("infoInsurance").textContent = vehicle.insurance || "";
  document.getElementById("infoFuelLevel").textContent = vehicle.fuelLevel || "";
  document.getElementById("infoDriverAge").textContent = vehicle.driverAge || "";
  document.getElementById("infoStatus").textContent = vehicle.status || "";
  document.getElementById("infoExpectedOutDateLabel").textContent = vehicle.status === "출고완료차량" ? "출고일자" : "출고예정일자";
  setInfoBox("infoAccidentModelBox", "infoAccidentModel", accidentModelOf(vehicle));
  setInfoBox("infoAccidentNumberBox", "infoAccidentNumber", accidentNumberOf(vehicle));
  setInfoBox("infoReceivedDateBox", "infoReceivedDate", vehicle.receivedDate || "");
  setInfoBox("infoExpectedOutDateBox", "infoExpectedOutDate", vehicle.expectedOutDate || "");
  setInfoBox("infoSpecialNoteBox", "infoSpecialNote", vehicle.specialNote || "");
  setInfoBox("infoUnavailableReasonBox", "infoUnavailableReason", vehicle.unavailableReason || "");
}

function toggleFields() {
  const status = document.getElementById("formStatus").value;
  const showSchedule = usesScheduleInfo(status);
  const showUnavailable = isUnavailable(status);
  document.querySelectorAll(".schedule-extra").forEach(el => el.classList.toggle("show", showSchedule));
  document.querySelectorAll(".unavailable-extra").forEach(el => el.classList.toggle("show", showUnavailable));
}

function renderStats() {
  const validVehicles = vehicles.filter(v => v.model && v.number);
  const activeVehicles = validVehicles.filter(v => v.status !== "출고완료차량");
  document.getElementById("count-all").textContent = activeVehicles.length;
  document.getElementById("count-ready").textContent = validVehicles.filter(v => v.status === "대기차량").length;
  document.getElementById("count-out").textContent = validVehicles.filter(v => v.status === "출고차량").length;
  document.getElementById("count-completed").textContent = validVehicles.filter(v => v.status === "출고완료차량").length;
  document.getElementById("count-reserved").textContent = validVehicles.filter(v => v.status === "예약차량").length;
  document.getElementById("count-unavailable").textContent = validVehicles.filter(v => v.status === "출고불가차량").length;
}

function paintActiveTab() {
  document.getElementById("tab-all").className = "stat" + (selectedTab === "전체" ? " active-all" : "");
  document.getElementById("tab-ready").className = "stat" + (selectedTab === "대기차량" ? " active-ready" : "");
  document.getElementById("tab-out").className = "stat" + (selectedTab === "출고차량" ? " active-out" : "");
  document.getElementById("tab-completed").className = "stat" + (selectedTab === "출고완료차량" ? " active-completed" : "");
  document.getElementById("tab-reserved").className = "stat" + (selectedTab === "예약차량" ? " active-reserved" : "");
  document.getElementById("tab-unavailable").className = "stat" + (selectedTab === "출고불가차량" ? " active-unavailable" : "");
}

function runHomeExpectedOutDateSearch() {
  selectedTab = null;
  selectedVehicleId = null;
  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.value = "";
  searchMatchId = null;
  document.getElementById("toolbar").classList.remove("show");
  const deleteAllBtn = document.getElementById("deleteAllCompletedBtn");
  if (deleteAllBtn) deleteAllBtn.style.display = "none";
  document.getElementById("homeFilter").classList.remove("hide");
  paintActiveTab();
  renderVehicles();
}

function normalizeSearchText(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[\s\-_.]/g, "");
}

function vehicleMatchesQuery(v, q) {
  const rawQ = String(q || "").trim().toLowerCase();
  const compactQ = normalizeSearchText(rawQ);
  const values = [
    v.model, v.number,
    accidentModelOf(v), accidentNumberOf(v), accidentTextOf(v),
    v.accidentVehicle, v.accidentVehicleModel, v.accidentVehicleNumber,
    v.specialNote, v.unavailableReason, v.fuel, v.insurance, v.driverAge
  ];

  return values.some(value => {
    const raw = String(value || "").toLowerCase();
    const compact = normalizeSearchText(value);
    return raw.includes(rawQ) || (compactQ && compact.includes(compactQ));
  });
}

function getCurrentListVehicles() {
  const homeExpectedOutDateFilter = normalizeDateValue(document.getElementById("homeExpectedOutDateFilter")?.value || "");
  let filtered = vehicles.filter(v => v.model && v.number);

  if (selectedTab) {
    if (selectedTab === "전체") {
      filtered = filtered.filter(v => v.status !== "출고완료차량");
    } else {
      filtered = filtered.filter(v => v.status === selectedTab);
    }
  } else {
    if (!homeExpectedOutDateFilter) return [];
    filtered = filtered
      .filter(v => v.status !== "출고완료차량")
      .filter(v => normalizeDateValue(v.expectedOutDate || v.expectedOutDateText || v.expected_out_date || "") === homeExpectedOutDateFilter);
  }

  return filtered;
}

function jumpToSearchMatch() {
  const q = document.getElementById("searchInput")?.value.trim() || "";
  searchMatchId = null;

  if (!q) {
    renderVehicles();
    return;
  }

  const target = getCurrentListVehicles().find(v => vehicleMatchesQuery(v, q));
  searchMatchId = target ? target.id : null;
  renderVehicles();

  if (target) {
    setTimeout(() => {
      const el = document.getElementById(`vehicle-card-${target.id}`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 40);
  }
}

function renderVehicles() {
  const list = document.getElementById("vehicleList");
  const homeExpectedOutDateFilter = normalizeDateValue(document.getElementById("homeExpectedOutDateFilter")?.value || "");

  if (!selectedTab && !homeExpectedOutDateFilter) {
    list.innerHTML = "";
    document.getElementById("vehicleCard").classList.remove("show");
    return;
  }

  if (!selectedTab) {
    document.getElementById("vehicleCard").classList.add("show");
    document.querySelector("#vehicleCard .card-title").textContent = `${homeExpectedOutDateFilter} 출고예정 차량`;
  }

  const filtered = getCurrentListVehicles();

  if (filtered.length === 0) {
    list.innerHTML = '<div class="muted-empty">검색 결과가 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(vehicle => {
    const unavailable = vehicle.status === "출고불가차량";
    const completed = vehicle.status === "출고완료차량";
    const outDateLabel = completed ? "출고일자" : "출고예정일자";
    const hitClass = searchMatchId === vehicle.id ? " search-hit" : "";
    return `
    <div class="vehicle-item${hitClass}" id="vehicle-card-${escapeHtml(vehicle.id)}">
      <div class="vehicle-top">
        <div><div class="vehicle-model">${escapeHtml(vehicle.model || "")}</div><div class="vehicle-number">${escapeHtml(vehicle.number || "")}</div></div>
        <div class="${badgeClass(vehicle.status)}">${escapeHtml(vehicle.status || "")}</div>
      </div>
      <div class="vehicle-meta">
        ${unavailable ? `
          <div class="vehicle-meta-box full"><span class="vehicle-meta-label">출고불가사유</span><span class="vehicle-meta-value">${escapeHtml(vehicle.unavailableReason || "-")}</span></div>
        ` : vehicle.status === "대기차량" ? `
          <div class="vehicle-meta-box"><span class="vehicle-meta-label">유종</span><span class="vehicle-meta-value">${escapeHtml(vehicle.fuel || "-")}</span></div>
          <div class="vehicle-meta-box"><span class="vehicle-meta-label">보험</span><span class="vehicle-meta-value">${escapeHtml(vehicle.insurance || "-")}</span></div>
          <div class="vehicle-meta-box full"><span class="vehicle-meta-label">운전자연령</span><span class="vehicle-meta-value">${escapeHtml(vehicle.driverAge || "-")}</span></div>
        ` : `
          <div class="vehicle-meta-box full"><span class="vehicle-meta-label">사고차량</span><span class="vehicle-meta-value">${escapeHtml(accidentTextOf(vehicle) || "-")}</span></div>
          <div class="vehicle-meta-box"><span class="vehicle-meta-label">입고일자</span><span class="vehicle-meta-value">${escapeHtml(vehicle.receivedDate || "-")}</span></div>
          <div class="vehicle-meta-box"><span class="vehicle-meta-label">${outDateLabel}</span><span class="vehicle-meta-value">${escapeHtml(vehicle.expectedOutDate || "-")}</span></div>
          <div class="vehicle-meta-box full"><span class="vehicle-meta-label">특이사항</span><span class="vehicle-meta-value">${escapeHtml(vehicle.specialNote || "-")}</span></div>
        `}
      </div>
      <div class="vehicle-actions">
        <button class="btn btn-outline" onclick="openDetail('${vehicle.id}')">상세보기</button>
        ${completed ? `<button class="btn btn-danger" onclick="deleteCompletedVehicle('${vehicle.id}')">삭제</button>` : `<button class="btn btn-outline" onclick="openForm('${vehicle.id}')">변경</button>`}
      </div>
    </div>`;
  }).join("");
}

function selectTab(tab) {
  if (selectedTab === tab) { goHome(); return; }
  selectedTab = tab;
  searchMatchId = null;
  paintActiveTab();
  document.getElementById("homeFilter").classList.add("hide");
  document.getElementById("toolbar").classList.add("show");
  document.getElementById("vehicleCard").classList.add("show");
  document.querySelector("#vehicleCard .card-title").textContent = "차량 목록";
  document.getElementById("toolbarTitle").textContent = tab === "전체" ? "전체차량 목록" : `${tab} 목록`;
  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.value = "";
  const deleteAllBtn = document.getElementById("deleteAllCompletedBtn");
  if (deleteAllBtn) deleteAllBtn.style.display = tab === "출고완료차량" ? "inline-block" : "none";
  renderVehicles();
}

function openDetail(id) {
  const vehicle = vehicles.find(v => v.id === id);
  if (!vehicle) return;
  selectedVehicleId = id;
  fillDetail(vehicle);
  document.getElementById("detailModal").classList.add("show");
}

function closeDetail() { document.getElementById("detailModal").classList.remove("show"); }

function openForm(id = null) {
  editingId = id;
  document.getElementById("formTitle").textContent = id ? "차량 정보 변경" : "차량 추가";
  document.getElementById("deleteBtn").style.display = id ? "inline-block" : "none";
  const vehicle = vehicles.find(v => v.id === id);

  document.getElementById("formModel").value = vehicle ? (vehicle.model || "") : "";
  document.getElementById("formNumber").value = vehicle ? (vehicle.number || "") : "";
  document.getElementById("formFuel").value = vehicle ? (vehicle.fuel || "가솔린") : "가솔린";
  document.getElementById("formInsurance").value = vehicle ? (vehicle.insurance || "종합보험") : "종합보험";
  document.getElementById("formDriverAge").value = vehicle ? (vehicle.driverAge || "만 26세 이상") : "만 26세 이상";
  document.getElementById("formStatus").value = vehicle ? (vehicle.status || "대기차량") : "대기차량";
  document.getElementById("formFuelLevel").value = vehicle ? (vehicle.fuelLevel || "100%") : "100%";
  document.getElementById("formAccidentModel").value = vehicle ? accidentModelOf(vehicle) : "";
  document.getElementById("formAccidentNumber").value = vehicle ? accidentNumberOf(vehicle) : "";
  document.getElementById("formReceivedDate").value = vehicle ? (vehicle.receivedDate || "") : "";
  document.getElementById("formExpectedOutDate").value = vehicle ? (vehicle.expectedOutDate || "") : "";
  document.getElementById("formSpecialNote").value = vehicle ? (vehicle.specialNote || "") : "";
  document.getElementById("formUnavailableReason").value = vehicle ? (vehicle.unavailableReason || "") : "";
  toggleFields();
  document.getElementById("formModal").classList.add("show");
  closeDetail();
}

function closeForm() { document.getElementById("formModal").classList.remove("show"); }

async function saveVehicle() {
  const model = document.getElementById("formModel").value.trim();
  const number = document.getElementById("formNumber").value.trim();
  const fuel = document.getElementById("formFuel").value;
  const insurance = document.getElementById("formInsurance").value.trim();
  const driverAge = document.getElementById("formDriverAge").value.trim();
  const status = document.getElementById("formStatus").value;
  const fuelLevel = document.getElementById("formFuelLevel").value;
  const accidentModel = document.getElementById("formAccidentModel").value.trim();
  const accidentNumber = document.getElementById("formAccidentNumber").value.trim();
  const receivedDate = document.getElementById("formReceivedDate").value;
  const expectedOutDate = document.getElementById("formExpectedOutDate").value;
  const specialNote = document.getElementById("formSpecialNote").value.trim();
  const unavailableReason = document.getElementById("formUnavailableReason").value.trim();
  const updatedAt = nowStamp();
  const existingVehicle = editingId ? (vehicles.find(v => v.id === editingId) || {}) : {};

  if (!model || !number) { alert("대차 차종이랑 대차 차량번호는 입력해야 함"); return; }

  if (usesScheduleInfo(status)) {
    const missing = [];
    if (!accidentModel) missing.push("사고차량 차종");
    if (!accidentNumber) missing.push("사고차량 차량번호");
    if (!receivedDate) missing.push("입고일자");
    if (!expectedOutDate) missing.push("출고예정일자");
    if (missing.length > 0) { alert(`${missing.join(", ")} 입력이 안 됐습니다.`); return; }
  }

  if (isUnavailable(status) && !unavailableReason) {
    alert("출고불가사유를 입력해야 함");
    return;
  }

  const schedule = usesScheduleInfo(status);
  const unavailable = isUnavailable(status);

  // 출고차량에서 출고불가차량으로 바꿔도 기존 사고차량/입고일자/출고예정일자/특이사항은 DB에서 지우지 않음.
  const keepAccidentModel = accidentModel || accidentModelOf(existingVehicle);
  const keepAccidentNumber = accidentNumber || accidentNumberOf(existingVehicle);
  const keepReceivedDate = receivedDate || existingVehicle.receivedDate || "";
  const keepExpectedOutDate = expectedOutDate || existingVehicle.expectedOutDate || "";
  const keepSpecialNote = specialNote || existingVehicle.specialNote || "";

  const payload = {
    model, number, fuel, insurance, driverAge, status, fuelLevel,
    accidentModel: schedule ? accidentModel : (unavailable ? keepAccidentModel : ""),
    accidentNumber: schedule ? accidentNumber : (unavailable ? keepAccidentNumber : ""),
    accidentVehicle: schedule
      ? [accidentModel, accidentNumber].filter(Boolean).join(" ")
      : (unavailable ? [keepAccidentModel, keepAccidentNumber].filter(Boolean).join(" ") : ""),
    receivedDate: schedule ? receivedDate : (unavailable ? keepReceivedDate : ""),
    expectedOutDate: schedule ? expectedOutDate : (unavailable ? keepExpectedOutDate : ""),
    specialNote: schedule ? specialNote : (unavailable ? keepSpecialNote : ""),
    unavailableReason: unavailable ? unavailableReason : "",
    note: "",
    updatedAt
  };

  try {
    if (editingId) {
      if (existingVehicle.status === "출고차량" && status === "대기차량") {
        await addDoc(vehiclesRef, {
          model: existingVehicle.model || model,
          number: existingVehicle.number || number,
          fuel: existingVehicle.fuel || fuel,
          insurance: existingVehicle.insurance || insurance,
          driverAge: existingVehicle.driverAge || driverAge,
          fuelLevel: existingVehicle.fuelLevel || fuelLevel,
          status: "출고완료차량",
          accidentModel: accidentModelOf(existingVehicle),
          accidentNumber: accidentNumberOf(existingVehicle),
          accidentVehicle: accidentTextOf(existingVehicle),
          receivedDate: existingVehicle.receivedDate || "",
          // 출고차량에서 대기차량으로 변경되는 순간의 실제 날짜와 시간을 출고일자로 저장
          expectedOutDate: updatedAt,
          specialNote: existingVehicle.specialNote || "",
          unavailableReason: "",
          note: "",
          completedAt: updatedAt,
          sourceVehicleId: editingId,
          updatedAt
        });
      }
      await updateDoc(doc(db, "vehicles", editingId), payload);
    }
    else await addDoc(vehiclesRef, payload);
    closeForm();
  } catch (err) {
    console.error(err);
    alert("저장 중 오류가 났습니다.");
  }
}

async function deleteVehicle() {
  if (!editingId) return;
  if (!confirm("삭제할까요?")) return;
  try { await deleteDoc(doc(db, "vehicles", editingId)); closeForm(); }
  catch (err) { console.error(err); alert("삭제 중 오류가 났습니다."); }
}

async function deleteCompletedVehicle(id) {
  const vehicle = vehicles.find(v => v.id === id);
  if (!vehicle || vehicle.status !== "출고완료차량") return;
  if (!confirm("이 출고완료차량을 삭제할까요?")) return;
  try { await deleteDoc(doc(db, "vehicles", id)); }
  catch (err) { console.error(err); alert("삭제 중 오류가 났습니다."); }
}

async function deleteAllCompletedVehicles() {
  const completedVehicles = vehicles.filter(v => v.status === "출고완료차량");
  if (completedVehicles.length === 0) { alert("삭제할 출고완료차량이 없습니다."); return; }
  if (!confirm(`출고완료차량 ${completedVehicles.length}대를 모두 삭제할까요?`)) return;
  try {
    await Promise.all(completedVehicles.map(v => deleteDoc(doc(db, "vehicles", v.id))));
  } catch (err) {
    console.error(err);
    alert("모두삭제 중 오류가 났습니다.");
  }
}

function goHome() {
  selectedTab = null;
  selectedVehicleId = null;
  searchMatchId = null;
  document.getElementById("searchInput").value = "";
  document.getElementById("toolbar").classList.remove("show");
  const deleteAllBtn = document.getElementById("deleteAllCompletedBtn");
  if (deleteAllBtn) deleteAllBtn.style.display = "none";
  document.getElementById("homeFilter").classList.remove("hide");
  document.getElementById("detailModal").classList.remove("show");
  document.querySelector("#vehicleCard .card-title").textContent = "차량 목록";
  paintActiveTab();
  renderVehicles();
}

function clearHomeExpectedOutDateFilter() {
  document.getElementById("homeExpectedOutDateFilter").value = "";
  document.querySelector("#vehicleCard .card-title").textContent = "차량 목록";
  renderVehicles();
}

window.onclick = function (e) {
  if (e.target.id === "detailModal") closeDetail();
  if (e.target.id === "formModal") closeForm();
};

window.selectTab = selectTab;
window.openDetail = openDetail;
window.closeDetail = closeDetail;
window.openForm = openForm;
window.closeForm = closeForm;
window.saveVehicle = saveVehicle;
window.toggleFields = toggleFields;
window.deleteVehicle = deleteVehicle;
window.deleteCompletedVehicle = deleteCompletedVehicle;
window.deleteAllCompletedVehicles = deleteAllCompletedVehicles;
window.goHome = goHome;
window.clearHomeExpectedOutDateFilter = clearHomeExpectedOutDateFilter;
window.runHomeExpectedOutDateSearch = runHomeExpectedOutDateSearch;
window.jumpToSearchMatch = jumpToSearchMatch;

onSnapshot(vehiclesRef, (snapshot) => {
  vehicles = snapshot.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .filter(v => ["대기차량", "출고차량", "출고완료차량", "예약차량", "출고불가차량"].includes(v.status))
    .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  renderStats();
  renderVehicles();
  if (selectedVehicleId) {
    const current = vehicles.find(v => v.id === selectedVehicleId);
    if (current) fillDetail(current);
    else closeDetail();
  }
});

paintActiveTab();
renderStats();
  </script>
</body>
</html>
