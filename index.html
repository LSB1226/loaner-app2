<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사고대차 차량 관리앱</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 30%),
        radial-gradient(circle at top right, #dcfce7 0%, transparent 25%),
        linear-gradient(180deg, #f8fbff 0%, #eef5ff 45%, #f8fafc 100%);
      color: #0f172a;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      background: linear-gradient(135deg, #0f172a, #1e3a5f 60%, #1d4ed8);
      color: white;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.16);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -40px;
      top: -40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      filter: blur(8px);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      left: -30px;
      bottom: -40px;
      border-radius: 50%;
      background: rgba(96,165,250,0.22);
      filter: blur(14px);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .chip {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      font-size: 13px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.14);
    }
    h1 { margin: 0; font-size: 28px; }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: white; color: #0f172a; }
    .btn-outline { background: white; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-danger { background: #ef4444; color: white; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      border-radius: 22px;
      padding: 18px;
      border: 1px solid #dbeafe;
      cursor: pointer;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(6px);
      text-align: left;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }
    .stat small { display: block; font-size: 13px; color: #475569; margin-bottom: 8px; }
    .stat strong { font-size: 28px; }
    .active-all { background: linear-gradient(135deg, #0f172a, #334155); color: white; }
    .active-all small { color: rgba(255,255,255,0.85); }
    .active-ready { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .active-ready small { color: rgba(255,255,255,0.85); }
    .active-out { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; }
    .active-out small { color: rgba(255,255,255,0.85); }
    .toolbar {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 14px;
    }
    .toolbar.show { display: flex; }
    .toolbar-left-title { font-size: 20px; font-weight: 800; }
    .toolbar-left-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
    .toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
    .search {
      flex: 1;
      min-width: 220px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .card {
      display: none;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }
    .card.show { display: block; }
    .card-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    .vehicle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .vehicle-item {
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px;
      background: #fff;
    }
    .vehicle-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }
    .vehicle-model { font-weight: 800; font-size: 18px; }
    .vehicle-number { font-size: 13px; color: #64748b; margin-top: 2px; }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .bg-ready { background: #d1fae5; color: #047857; }
    .bg-out { background: #e0f2fe; color: #0369a1; }
    .vehicle-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
      gap: 10px;
    }
    .vehicle-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .vehicle-actions .btn { flex: 1; }
    .muted-empty {
      text-align: center;
      color: #64748b;
      padding: 28px 10px;
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      background: #f8fafc;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 24px;
      padding: 18px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 22px; font-weight: 800; }
    .modal-sub { font-size: 14px; color: #64748b; margin-top: 4px; }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
    }
    .info-box.full { grid-column: 1 / -1; }
    .label { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .value { font-size: 15px; font-weight: 700; }
    .form-grid {
      display: grid;
      gap: 12px;
    }
    .form-two {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 14px;
      background: white;
    }
    .form-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .form-actions-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .info-grid, .form-two { grid-template-columns: 1fr; }
      .toolbar-right { width: 100%; }
      .btn { width: auto; }
      .vehicle-actions { flex-direction: row; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="chip">사고대차 차량 관리앱</div>
          <h1>대차현황</h1>
        </div>
        <button class="btn btn-primary" onclick="openForm()">차량 추가</button>
      </div>
    </div>

    <div class="grid">
      <button class="stat" id="tab-all" onclick="selectTab('전체')"><small>전체차량</small><strong id="count-all">0</strong></button>
      <button class="stat" id="tab-ready" onclick="selectTab('공장대기')"><small>공장대기</small><strong id="count-ready">0</strong></button>
      <button class="stat" id="tab-out" onclick="selectTab('대차출고')"><small>대차출고</small><strong id="count-out">0</strong></button>
    </div>

    <div class="toolbar" id="toolbar">
      <div>
        <div class="toolbar-left-title" id="toolbarTitle">차량 목록</div>
        <div class="toolbar-left-sub">차량을 눌러 상세정보를 확인할 수 있습니다.</div>
      </div>
      <div class="toolbar-right">
        <input id="searchInput" class="search" type="text" placeholder="차종 또는 차량번호 검색" oninput="renderVehicles()" />
        <button class="btn btn-outline" onclick="goHome()">처음화면</button>
      </div>
    </div>

    <div class="card" id="vehicleCard">
      <div class="card-title">차량 목록</div>
      <div class="vehicle-grid" id="vehicleList"></div>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="detailModel"></div>
          <div class="modal-sub" id="detailNumber"></div>
        </div>
        <div id="detailBadge"></div>
      </div>

      <div class="info-grid">
        <div class="info-box"><div class="label">차종</div><div class="value" id="infoModel"></div></div>
        <div class="info-box"><div class="label">차량번호</div><div class="value" id="infoNumber"></div></div>
        <div class="info-box"><div class="label">유종</div><div class="value" id="infoFuel"></div></div>
        <div class="info-box"><div class="label">보험</div><div class="value" id="infoInsurance"></div></div>
        <div class="info-box full"><div class="label">운전자 연령</div><div class="value" id="infoDriverAge"></div></div>
        <div class="info-box full"><div class="label">최신 상태</div><div class="value" id="infoStatus"></div></div>
        <div class="info-box full" id="infoNoteBox" style="display:none;"><div class="label">메모</div><div class="value" id="infoNote"></div></div>
      </div>

      <button class="btn btn-primary" style="width:100%;" onclick="closeDetail()">닫기</button>
    </div>
  </div>

  <div class="modal" id="formModal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="formTitle">차량 추가</div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>차종</label>
          <input id="formModel" placeholder="예: K5" />
        </div>
        <div class="form-group">
          <label>차량번호</label>
          <input id="formNumber" placeholder="예: 123하4567" />
        </div>
        <div class="form-two">
          <div class="form-group">
            <label>유종</label>
            <select id="formFuel">
              <option>가솔린</option>
              <option>디젤</option>
              <option>LPG</option>
              <option>하이브리드</option>
              <option>전기</option>
            </select>
          </div>
          <div class="form-group">
            <label>보험</label>
            <input id="formInsurance" />
          </div>
        </div>
        <div class="form-two">
          <div class="form-group">
            <label>운전자연령</label>
            <input id="formDriverAge" />
          </div>
          <div class="form-group">
            <label>상태</label>
            <select id="formStatus">
              <option>공장대기</option>
              <option>대차출고</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>유류량</label>
          <select id="formFuelLevel">
            <option>가득</option>
            <option>3/4</option>
            <option>1/2</option>
            <option>1/4</option>
          </select>
        </div>
        <div class="form-group">
          <label>메모</label>
          <input id="formNote" placeholder="간단 메모" />
        </div>
      </div>

      <div class="form-actions">
        <div>
          <button class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteVehicle()">삭제</button>
        </div>
        <div class="form-actions-right">
          <button class="btn btn-outline" onclick="closeForm()">취소</button>
          <button class="btn btn-primary" onclick="saveVehicle()">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const initialVehicles = [
      { id: 1, model: '아반떼', number: '123하4567', fuel: '가솔린', insurance: '종합보험', driverAge: '만 26세 이상', status: '공장대기', fuelLevel: '가득', updatedAt: '2026-03-29 09:10', note: '점검 완료' },
      { id: 2, model: '쏘나타', number: '234호5678', fuel: 'LPG', insurance: '종합보험', driverAge: '만 26세 이상', status: '대차출고', fuelLevel: '3/4', updatedAt: '2026-03-29 10:40', note: '고객 사용중' },
      { id: 3, model: 'K5', number: '345허6789', fuel: '가솔린', insurance: '종합보험', driverAge: '만 21세 이상', status: '공장대기', fuelLevel: '1/2', updatedAt: '2026-03-29 08:20', note: '' },
      { id: 4, model: '레이', number: '456하7890', fuel: '가솔린', insurance: '종합보험', driverAge: '만 26세 이상', status: '공장대기', fuelLevel: '1/4', updatedAt: '2026-03-29 11:05', note: '와이퍼 교체 예정' },
      { id: 5, model: '모닝', number: '567호8901', fuel: '가솔린', insurance: '종합보험', driverAge: '만 21세 이상', status: '대차출고', fuelLevel: '가득', updatedAt: '2026-03-29 13:15', note: '' },
    ];

    let vehicles = JSON.parse(localStorage.getItem('loanerVehiclesHtml') || 'null') || initialVehicles;
    vehicles = vehicles.map(v => ({ ...v, fuelLevel: v.fuelLevel || '가득' })).filter(v => v.status === '공장대기' || v.status === '대차출고');
    let selectedTab = null;
    let selectedVehicleId = null;
    let editingId = null;

    function saveStorage() {
      localStorage.setItem('loanerVehiclesHtml', JSON.stringify(vehicles));
    }

    function nowStamp() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${d} ${hh}:${mm}`;
    }

    function badgeClass(status) {
      if (status === '공장대기') return 'badge bg-ready';
      return 'badge bg-out';
    }

    function renderStats() {
      const total = vehicles.length;
      const ready = vehicles.filter(v => v.status === '공장대기').length;
      const out = vehicles.filter(v => v.status === '대차출고').length;
      document.getElementById('count-all').textContent = total;
      document.getElementById('count-ready').textContent = ready;
      document.getElementById('count-out').textContent = out;
    }

    function paintActiveTab() {
      document.getElementById('tab-all').className = 'stat' + (selectedTab === '전체' ? ' active-all' : '');
      document.getElementById('tab-ready').className = 'stat' + (selectedTab === '공장대기' ? ' active-ready' : '');
      document.getElementById('tab-out').className = 'stat' + (selectedTab === '대차출고' ? ' active-out' : '');
    }

    function selectTab(tab) {
      if (selectedTab === tab) {
        goHome();
        return;
      }
      selectedTab = tab;
      paintActiveTab();
      const toolbar = document.getElementById('toolbar');
      const card = document.getElementById('vehicleCard');
      toolbar.classList.add('show');
      card.classList.add('show');
      document.getElementById('toolbarTitle').textContent = tab === '전체' ? '전체차량 목록' : `${tab} 차량 목록`;
      renderVehicles();
    }

    function renderVehicles() {
      const list = document.getElementById('vehicleList');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = vehicles;

      if (selectedTab && selectedTab !== '전체') {
        filtered = filtered.filter(v => v.status === selectedTab);
      }
      if (q) {
        filtered = filtered.filter(v => v.model.toLowerCase().includes(q) || v.number.toLowerCase().includes(q));
      }

      if (!selectedTab) {
        list.innerHTML = '';
        return;
      }

      if (filtered.length === 0) {
        list.innerHTML = '<div class="muted-empty">검색 결과가 없습니다.</div>';
        return;
      }

      list.innerHTML = filtered.map(vehicle => `
        <div class="vehicle-item">
          <div class="vehicle-top">
            <div>
              <div class="vehicle-model">${vehicle.model}</div>
              <div class="vehicle-number">${vehicle.number}</div>
            </div>
            <div class="${badgeClass(vehicle.status)}">${vehicle.status}</div>
          </div>
          <div class="vehicle-meta">
            <span>${vehicle.fuel}</span>
            <span>업데이트 ${vehicle.updatedAt}</span>
          </div>
          <div class="vehicle-actions">
            <button class="btn btn-outline" onclick="openDetail(${vehicle.id})">상세보기</button>
            <button class="btn btn-outline" onclick="openForm(${vehicle.id})">변경</button>
          </div>
        </div>
      `).join('');
    }

    function openDetail(id) {
      const vehicle = vehicles.find(v => v.id === id);
      if (!vehicle) return;
      selectedVehicleId = id;
      document.getElementById('detailModel').textContent = vehicle.model;
      document.getElementById('detailNumber').textContent = vehicle.number;
      document.getElementById('detailBadge').innerHTML = `<div class="${badgeClass(vehicle.status)}">${vehicle.status}</div>`;
      document.getElementById('infoModel').textContent = vehicle.model;
      document.getElementById('infoNumber').textContent = vehicle.number;
      document.getElementById('infoFuel').textContent = vehicle.fuel;
      document.getElementById('infoInsurance').textContent = vehicle.insurance;
      document.getElementById('infoDriverAge').textContent = vehicle.driverAge;
      document.getElementById('infoStatus').textContent = vehicle.status;
      if (vehicle.note) {
        document.getElementById('infoNoteBox').style.display = 'block';
        document.getElementById('infoNote').textContent = vehicle.note;
      } else {
        document.getElementById('infoNoteBox').style.display = 'none';
        document.getElementById('infoNote').textContent = '';
      }
      document.getElementById('detailModal').classList.add('show');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function openForm(id = null) {
      editingId = id;
      document.getElementById('formTitle').textContent = id ? '차량 정보 변경' : '차량 추가';
      document.getElementById('deleteBtn').style.display = id ? 'inline-block' : 'none';

      const vehicle = vehicles.find(v => v.id === id);
      document.getElementById('formModel').value = vehicle ? vehicle.model : '';
      document.getElementById('formNumber').value = vehicle ? vehicle.number : '';
      document.getElementById('formFuel').value = vehicle ? vehicle.fuel : '가솔린';
      document.getElementById('formInsurance').value = vehicle ? vehicle.insurance : '종합보험';
      document.getElementById('formDriverAge').value = vehicle ? vehicle.driverAge : '만 26세 이상';
      document.getElementById('formStatus').value = vehicle ? vehicle.status : '공장대기';
      document.getElementById('formFuelLevel').value = vehicle ? (vehicle.fuelLevel || '가득') : '가득';
      document.getElementById('formNote').value = vehicle ? vehicle.note : '';
      document.getElementById('formModal').classList.add('show');
      closeDetail();
    }

    function closeForm() {
      document.getElementById('formModal').classList.remove('show');
    }

    function saveVehicle() {
      const model = document.getElementById('formModel').value.trim();
      const number = document.getElementById('formNumber').value.trim();
      const fuel = document.getElementById('formFuel').value;
      const insurance = document.getElementById('formInsurance').value.trim();
      const driverAge = document.getElementById('formDriverAge').value.trim();
      const status = document.getElementById('formStatus').value;
      const fuelLevel = document.getElementById('formFuelLevel').value;
      const note = document.getElementById('formNote').value.trim();

      if (!model || !number) {
        alert('차종이랑 차량번호는 입력해야 함');
        return;
      }

      const stamp = nowStamp();

      if (editingId) {
        const vehicle = vehicles.find(v => v.id === editingId);
        if (vehicle) {
          vehicle.model = model;
          vehicle.number = number;
          vehicle.fuel = fuel;
          vehicle.insurance = insurance;
          vehicle.driverAge = driverAge;
          vehicle.status = status;
          vehicle.fuelLevel = fuelLevel;
          vehicle.note = note;
          vehicle.updatedAt = stamp;
        }
      } else {
        vehicles.unshift({
          id: Date.now(),
          model,
          number,
          fuel,
          insurance,
          driverAge,
          status,
          fuelLevel,
          note,
          updatedAt: stamp,
        });
      }

      vehicles = vehicles.filter(v => v.status === '공장대기' || v.status === '대차출고');
      saveStorage();
      renderStats();
      renderVehicles();
      closeForm();
    }

    function deleteVehicle() {
      if (!editingId) return;
      vehicles = vehicles.filter(v => v.id !== editingId);
      saveStorage();
      renderStats();
      renderVehicles();
      closeForm();
    }

    function goHome() {
      selectedTab = null;
      selectedVehicleId = null;
      document.getElementById('searchInput').value = '';
      document.getElementById('toolbar').classList.remove('show');
      document.getElementById('vehicleCard').classList.remove('show');
      document.getElementById('detailModal').classList.remove('show');
      paintActiveTab();
    }

    window.onclick = function(e) {
      if (e.target.id === 'detailModal') closeDetail();
      if (e.target.id === 'formModal') closeForm();
    };

    renderStats();
    paintActiveTab();
  </script>
</body>
</html>
